<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Subscription status — Pink PDF Plus</title><style>body{margin:0;background:#F3F5F8;color:#17243A;font-family:Segoe UI,system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(90%,520px);background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 36px #17243a12}h1{margin-top:0}.muted{color:#667085;line-height:1.6}.msg{padding:12px;border-radius:10px;background:#eef5ff;color:#214d83}.btn{display:inline-block;margin-top:16px;background:#17243A;color:#fff;text-decoration:none;padding:12px 20px;border-radius:999px;font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="card"><h1>Checking your subscription</h1><p class="muted">PayPal has returned you to Pink PDF Plus. We are checking the subscription with PayPal before showing its status.</p><p id="status" class="msg">Please wait…</p><a class="btn" href="/account.html">Go to your account</a></main>
<script>
(async()=>{const box=document.getElementById('status');try{const cfgRes=await fetch('/.netlify/functions/public-config',{cache:'no-store'});if(!cfgRes.ok)throw new Error('Account service is unavailable.');const cfg=await cfgRes.json();const client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await client.auth.getSession();if(!session?.access_token)throw new Error('Please sign in again, then check your membership on the account page.');const id=new URLSearchParams(location.search).get('subscription_id');if(!id)throw new Error('PayPal did not return a subscription ID. Check your account page in a moment.');const res=await fetch('/.netlify/functions/paypal-verify-subscription',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({subscription_id:id})});const result=await res.json();if(!res.ok)throw new Error(result.error||'Could not verify the subscription.');box.textContent=result.status==='active'?`${result.tier.toUpperCase()} membership is active. You can manage your account now.`:`PayPal subscription status: ${result.status}. Membership access will be enabled only after PayPal confirms activation.`;box.style.background=result.status==='active'?'#edfaf3':'#fff7e8';box.style.color=result.status==='active'?'#176b3a':'#8a5a12';}catch(e){box.textContent=e.message||'Could not verify the subscription. Please open your account page.';box.style.background='#fff0f0';box.style.color='#a12b2b';}})();
</script></body></html>
